image:
  repository: ghcr.io/sudeshc/rustlakedb
  tag: "6.0.0"
  pullPolicy: IfNotPresent

warehouse:
  uri: "s3://rustlakedb-warehouse"
  awsEndpointUrl: ""
  awsRegion: "us-east-1"

auth:
  jwtSecret: ""
  oidcJwksUrl: ""

mtls:
  enabled: false
  secretName: "rustlakedb-cluster-mtls"

coordinator:
  replicas: 1
  pgPort: 5432
  controlPlanePort: 8181
  flightPort: 8815
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"

workers:
  replicas: 3
  minReplicas: 2
  maxReplicas: 32
  targetCpuUtilizationPercentage: 70
  rpcPort: 7001
  spotTolerations: true
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"

maintainer:
  enabled: true
