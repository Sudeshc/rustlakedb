apiVersion: v1
kind: Service
metadata:
  name: rustlakedb-workers
  labels:
    app: rustlakedb-worker
spec:
  clusterIP: None
  selector:
    app: rustlakedb-worker
  ports:
    - name: rpc
      port: {{ .Values.workers.rpcPort }}
      targetPort: {{ .Values.workers.rpcPort }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustlakedb-worker
spec:
  serviceName: rustlakedb-workers
  replicas: {{ .Values.workers.replicas }}
  selector:
    matchLabels:
      app: rustlakedb-worker
  template:
    metadata:
      labels:
        app: rustlakedb-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - "--mode"
            - "worker"
            - "--worker-id"
            - "$(POD_NAME)"
            - "--bind"
            - "0.0.0.0:{{ .Values.workers.rpcPort }}"
            - "--advertise-url"
            - "{{ if .Values.mtls.enabled }}https{{ else }}http{{ end }}://$(POD_NAME).rustlakedb-workers:{{ .Values.workers.rpcPort }}"
            - "--coordinator-url"
            - "http://rustlakedb-coordinator:{{ .Values.coordinator.controlPlanePort }}"
            - "--storage-uri"
            - "{{ .Values.warehouse.uri }}"
            - "--data-dir"
            - "/var/lib/rustlakedb"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.mtls.enabled }}
            - name: RUSTLAKEDB_MTLS_CA
              value: "/etc/rustlakedb/mtls/ca.crt"
            - name: RUSTLAKEDB_MTLS_CERT
              value: "/etc/rustlakedb/mtls/server.crt"
            - name: RUSTLAKEDB_MTLS_KEY
              value: "/etc/rustlakedb/mtls/server.key"
            {{- end }}
          ports:
            - containerPort: {{ .Values.workers.rpcPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.workers.rpcPort }}
              scheme: {{ if .Values.mtls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            periodSeconds: 5
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: mtls-certs
              mountPath: /etc/rustlakedb/mtls
              readOnly: true
          {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: mtls-certs
          secret:
            secretName: {{ .Values.mtls.secretName }}
      {{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rustlakedb-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: rustlakedb-worker
  minReplicas: {{ .Values.workers.minReplicas }}
  maxReplicas: {{ .Values.workers.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.workers.targetCpuUtilizationPercentage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustlakedb-coordinator
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      app: rustlakedb-coordinator
  template:
    metadata:
      labels:
        app: rustlakedb-coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.coordinator.controlPlanePort }}"
    spec:
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - "--mode"
            - "coordinator"
            - "--pg-addr"
            - "0.0.0.0:{{ .Values.coordinator.pgPort }}"
            - "--rest-addr"
            - "0.0.0.0:{{ .Values.coordinator.controlPlanePort }}"
            - "--flight-addr"
            - "0.0.0.0:{{ .Values.coordinator.flightPort }}"
            - "--storage-uri"
            - "{{ .Values.warehouse.uri }}"
            - "--data-dir"
            - "/var/lib/rustlakedb"
          env:
            {{- if .Values.auth.oidcJwksUrl }}
            - name: RUSTLAKEDB_OIDC_JWKS_URL
              value: "{{ .Values.auth.oidcJwksUrl }}"
            {{- end }}
            {{- if .Values.mtls.enabled }}
            - name: RUSTLAKEDB_MTLS_CA
              value: "/etc/rustlakedb/mtls/ca.crt"
            - name: RUSTLAKEDB_MTLS_CERT
              value: "/etc/rustlakedb/mtls/client.crt"
            - name: RUSTLAKEDB_MTLS_KEY
              value: "/etc/rustlakedb/mtls/client.key"
            {{- end }}
          ports:
            - name: pgwire
              containerPort: {{ .Values.coordinator.pgPort }}
            - name: control-plane
              containerPort: {{ .Values.coordinator.controlPlanePort }}
            - name: flight-sql
              containerPort: {{ .Values.coordinator.flightPort }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: mtls-certs
              mountPath: /etc/rustlakedb/mtls
              readOnly: true
          {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: mtls-certs
          secret:
            secretName: {{ .Values.mtls.secretName }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: rustlakedb-coordinator
spec:
  selector:
    app: rustlakedb-coordinator
  ports:
    - name: pgwire
      port: {{ .Values.coordinator.pgPort }}
      targetPort: {{ .Values.coordinator.pgPort }}
    - name: control-plane
      port: {{ .Values.coordinator.controlPlanePort }}
      targetPort: {{ .Values.coordinator.controlPlanePort }}
    - name: flight-sql
      port: {{ .Values.coordinator.flightPort }}
      targetPort: {{ .Values.coordinator.flightPort }}
