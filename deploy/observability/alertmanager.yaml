global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'severity']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
  receiver: 'slack-lakehouse-warnings'
  routes:
    - matchers:
        - page="true"
      receiver: 'pagerduty-lakehouse-oncall'
      group_wait: 10s
      repeat_interval: 30m
    - matchers:
        - severity="critical"
      receiver: 'pagerduty-lakehouse-oncall'
      group_wait: 10s
      repeat_interval: 30m

inhibit_rules:
  # Suppress individual latency/warning alerts when a Raft quorum or critical burn-rate page is firing
  - source_matchers:
      - alertname="RustLakeDBRaftNoLeader"
    target_matchers:
      - severity="warning"
    equal: ['cluster']
  - source_matchers:
      - alertname="RustLakeDBQueryErrorBurnRateCritical"
    target_matchers:
      - alertname="RustLakeDBQueryErrorBurnRateWarning"
    equal: ['cluster']

receivers:
  - name: 'pagerduty-lakehouse-oncall'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          runbook: '{{ .CommonAnnotations.runbook_url }}'
          firing: '{{ .Alerts.Firing | len }}'

  - name: 'slack-lakehouse-warnings'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#lakehouse-sre-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: "Runbook: {{ .CommonAnnotations.runbook_url }}\n{{ .CommonAnnotations.description }}"
