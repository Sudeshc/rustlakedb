# RustLakeDB Local Cloud & Client Test Environment
# Spin up S3-compatible MinIO + optional psql client for external integration testing:
#   docker compose -f docker/docker-compose.test.yml up -d minio minio-init
#   docker compose -f docker/docker-compose.test.yml --profile client run --rm psql

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: rustlakedb-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rustlakedb
      MINIO_ROOT_PASSWORD: rustlakedb_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rustlakedb rustlakedb_dev_password;
      mc mb -p local/rustlakedb-warehouse || true;
      mc anonymous set none local/rustlakedb-warehouse;
      echo 'MinIO warehouse bucket ready at s3://rustlakedb-warehouse';
      "

  psql:
    image: postgres:16-alpine
    profiles: ["client"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGHOST: host.docker.internal
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: rustlakedb
    entrypoint: ["psql"]
