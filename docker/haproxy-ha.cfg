global
    maxconn 4096
    nbthread 2

defaults
    mode tcp
    timeout connect 3s
    timeout client  120s
    timeout server  120s
    retries 3

# L4 TCP Load Balancer for PostgreSQL v3 Wire Protocol (PGWire :5432)
frontend pgwire_front
    bind *:5432
    mode tcp
    default_backend pgwire_coords

backend pgwire_coords
    mode tcp
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    server coord-1 coord-1:5432 check port 8181 inter 2s fall 2 rise 1
    server coord-2 coord-2:5432 check port 8181 inter 2s fall 2 rise 1
    server coord-3 coord-3:5432 check port 8181 inter 2s fall 2 rise 1

# L7/L4 Load Balancer for Control Plane, Iceberg v3 REST, Arrow IPC & Prometheus
frontend http_front
    bind *:8181
    mode http
    default_backend http_coords

backend http_coords
    mode http
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    server coord-1 coord-1:8181 check inter 2s fall 2 rise 1
    server coord-2 coord-2:8181 check inter 2s fall 2 rise 1
    server coord-3 coord-3:8181 check inter 2s fall 2 rise 1

# L4 TCP Load Balancer for Apache Arrow Flight SQL gRPC (:8815)
frontend flight_front
    bind *:8815
    mode tcp
    default_backend flight_coords

backend flight_coords
    mode tcp
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    server coord-1 coord-1:8815 check port 8181 inter 2s fall 2 rise 1
    server coord-2 coord-2:8815 check port 8181 inter 2s fall 2 rise 1
    server coord-3 coord-3:8815 check port 8181 inter 2s fall 2 rise 1
