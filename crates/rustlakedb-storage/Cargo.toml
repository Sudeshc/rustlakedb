[package]
name = "rustlakedb-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Enable cloud object-store drivers (AWS S3, GCP GCS, Azure ADLS/Blob) when deploying to cloud.
cloud = ["object_store/aws", "object_store/gcp", "object_store/azure"]

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
bytes.workspace = true
futures.workspace = true
object_store.workspace = true
parking_lot.workspace = true
parquet.workspace = true
roaring.workspace = true
rustlakedb-catalog = { path = "../rustlakedb-catalog" }
rustlakedb-common = { path = "../rustlakedb-common" }
rustlakedb-protocol = { path = "../rustlakedb-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
xxhash-rust.workspace = true
