name: Release & Publish GHCR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build Release Binary (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (with Cloud S3/GCS/Azure)
        run: cargo build --release --locked --bin rustlakedb
      - name: Package release tarball + SHA256
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp target/release/rustlakedb dist/
          cp LICENSE COPYRIGHT README.md CHANGELOG.md dist/
          tar -czf "rustlakedb-${TAG}-linux-x86_64.tar.gz" -C dist .
          sha256sum "rustlakedb-${TAG}-linux-x86_64.tar.gz" > "rustlakedb-${TAG}-linux-x86_64.tar.gz.sha256"
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            rustlakedb-*.tar.gz
            rustlakedb-*.sha256

  publish-ghcr:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, publish-ghcr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release-assets/* \
            --title "RustLakeDB $TAG" \
            --generate-notes || \
          gh release upload "$TAG" release-assets/* --clobber
