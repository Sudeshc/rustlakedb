name: Release & Publish GHCR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build Release Binary (${{ matrix.target_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            ext: tar.gz
            bin: rustlakedb
          - os: ubuntu-24.04-arm
            target_name: linux-aarch64
            ext: tar.gz
            bin: rustlakedb
          - os: macos-latest
            target_name: macos-aarch64
            ext: tar.gz
            bin: rustlakedb
          - os: windows-latest
            target_name: windows-x86_64
            ext: zip
            bin: rustlakedb.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (with Cloud S3/GCS/Azure)
        run: cargo build --release --locked --bin rustlakedb
      - name: Package Unix tarball + SHA256
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="rustlakedb-${TAG}-${{ matrix.target_name }}.tar.gz"
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" dist/
          cp LICENSE COPYRIGHT README.md CHANGELOG.md dist/
          tar -czf "${NAME}" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${NAME}" > "${NAME}.sha256"
          else
            shasum -a 256 "${NAME}" > "${NAME}.sha256"
          fi
      - name: Package Windows zip + SHA256
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $name = "rustlakedb-$tag-${{ matrix.target_name }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\${{ matrix.bin }}", "LICENSE", "COPYRIGHT", "README.md", "CHANGELOG.md" dist\
          Compress-Archive -Path dist\* -DestinationPath $name -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_name }}
          path: |
            rustlakedb-*.tar.gz
            rustlakedb-*.zip
            rustlakedb-*.sha256

  publish-ghcr-arch:
    name: Build & Push GHCR Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase Image Name
        run: echo "IMAGE_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Platform Digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_LOWER }},push-by-digest=true,name-canonical=true,push=true
      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-ghcr-manifest:
    name: Merge Multi-Arch GHCR Manifest (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [publish-ghcr-arch]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create Multi-Arch Manifest List
        working-directory: /tmp/digests
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS_ARGS="$TAGS_ARGS -t $tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create $TAGS_ARGS $(printf "${IMAGE_LOWER}@sha256:%s " *)

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, publish-ghcr-manifest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release-assets/* \
            --title "RustLakeDB $TAG" \
            --generate-notes || \
          gh release upload "$TAG" release-assets/* --clobber
