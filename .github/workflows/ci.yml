name: RustLakeDB CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Clippy, Security & Full Regression Suite (Waves 1-33, TPC-H 22/22 & Chaos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify GPLv3 SPDX License Headers
        run: |
          MISSING=$(find crates -name '*.rs' -exec grep -L 'SPDX-License-Identifier: GPL-3.0-or-later' {} +)
          if [ -n "$MISSING" ]; then
            echo "Missing GPLv3 SPDX headers in:"
            echo "$MISSING"
            exit 1
          fi
          echo "All Rust source files carry GPL-3.0-or-later headers."
      - name: Strict Clippy Check (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build CLI binary (with Cloud S3/GCS/Azure support)
        run: cargo build --bin rustlakedb
      - name: Run Full Automated Regression Suite (100+ tests + TPC-H 22/22 + Chaos)
        run: cargo test --workspace
      - name: Verify Cloud Object-Store Feature Flag (S3/GCS/Azure)
        run: cargo check -p rustlakedb-storage --features cloud
      - name: Verify Locked Dependency Graph (Supply-Chain Check)
        run: cargo metadata --locked --format-version 1 > /dev/null

  docker-build:
    name: Multi-Stage Docker Image Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Build RustLakeDB v8.0.0 Docker Image
        run: docker build -t rustlakedb:8.0.0 .
